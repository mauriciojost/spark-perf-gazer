[project]
name = "perfgazer-analyzer"
version = "0.1.0"
description = "MCP server to analyze PerfGazer output using Spark SQL"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyspark>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
perfgazer-analyzer = "perfgazer_analyzer.server:mcp.run"
